name: CI

on:
  push:
    branches: [main, update-charter]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.github/FUNDING.yml'
              - '!.github/CODEOWNERS'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/*_TEMPLATE.md'
              - '!.github/pull_request_template.md'
              - '!.github/copilot-instructions.md'
              - '!.github/workflows/dev-charter-check.yml'
              - '!.github/workflows/auto-assign-self.yml'
              # Files distributed by dev-charter (git subtree update PRs).
              - '!.pre-commit-config.yaml'
              - '!scripts/check-*'
              - '!scripts/install.*'
              - '!scripts/PSScriptAnalyzerSettings.psd1'

  security:
    name: Security scan (pre-commit)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # powershell-lint is a local-only convenience check (see
          # .pre-commit-config.yaml); it isn't required to gate merges.
          SKIP: powershell-lint

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # SwiftLint runs on Linux (x1 billing) instead of macOS (x10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run SwiftLint
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/realm/swiftlint:latest swiftlint --strict

  build:
    name: Build & Test
    # Start the macOS job (x10 billing) only after the cheap checks pass.
    needs: [changes, security, lint]
    if: needs.changes.outputs.code == 'true'
    # Set the repository variable MACOS_RUNNER (e.g. to a self-hosted runner
    # label) in PRIVATE repositories only; never on a public repository.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    env:
      SCHEME: Swift AI App Template
    steps:
      - uses: actions/checkout@v7

      - name: Resolve packages (Core)
        run: swift package resolve
        working-directory: Packages/Core

      - name: Run Core unit tests
        run: swift test
        working-directory: Packages/Core

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build

  gate:
    name: CI
    needs: [changes, security, lint, build]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::security did not succeed (got: ${{ needs.security.result }})"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "docs/config-only change; nothing further to verify"
            exit 0
          fi
          for result in "${{ needs.lint.result }}" "${{ needs.build.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed (got: $result)"
              exit 1
            fi
          done
