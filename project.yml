name: Swift AI App Template

options:
  deploymentTarget:
    macOS: "26.0"
    # iOS: "26.0" # Uncomment when adding an iOS target.
  developmentLanguage: ja

settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}

packages:
  Core:
    path: Packages/Core

targets:
  Swift AI App Template:
    type: application
    platform: macOS
    sources:
      - path: App/macOS
    info:
      path: App/macOS/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_NAME: "Swift AI App Template"
        PRODUCT_BUNDLE_IDENTIFIER: y.marui.Swift-AI-App-Template
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/macOS/Swift AI App Template Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/macOS/Swift AI App Template Release.entitlements
    dependencies:
      - package: Core

